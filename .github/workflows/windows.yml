name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: reg import tests/ludusavi.reg
      - run: New-Item -ItemType Junction -Path tests/root3/game5/data-symlink -Target (Resolve-Path tests/root3/game5/data)
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace -- --deny warnings
      - run: cargo test --locked

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
          - architecture: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: ./scripts/package-windows.ps1 -Executable target/${{ matrix.target }}/release/slotharbor.exe -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: SlotHarbor-windows-${{ matrix.architecture }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
